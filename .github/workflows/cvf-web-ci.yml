name: CVF v1.6 Web CI

on:
  push:
    paths:
      - "EXTENSIONS/CVF_v1.6_AGENT_PLATFORM/cvf-web/**"
      - "EXTENSIONS/CVF_CONTROL_PLANE_FOUNDATION/**"
      - "EXTENSIONS/CVF_GUARD_CONTRACT/**"
      - "EXTENSIONS/CVF_MODEL_GATEWAY/**"
      - "EXTENSIONS/CVF_LEARNING_PLANE_FOUNDATION/**"
      - "EXTENSIONS/CVF_EXECUTION_PLANE_FOUNDATION/**"
      - "EXTENSIONS/CVF_TRUTH_KERNEL/**"
      - "EXTENSIONS/CVF_TRUTH_FLOW/**"
      - "EXTENSIONS/CVF_REFINERY/**"
      - "EXTENSIONS/CVF_ECO_v2.5_MCP_SERVER/**"
      - ".github/workflows/cvf-web-ci.yml"
  pull_request:
    paths:
      - "EXTENSIONS/CVF_v1.6_AGENT_PLATFORM/cvf-web/**"
      - "EXTENSIONS/CVF_CONTROL_PLANE_FOUNDATION/**"
      - "EXTENSIONS/CVF_GUARD_CONTRACT/**"
      - "EXTENSIONS/CVF_MODEL_GATEWAY/**"
      - "EXTENSIONS/CVF_LEARNING_PLANE_FOUNDATION/**"
      - "EXTENSIONS/CVF_EXECUTION_PLANE_FOUNDATION/**"
      - "EXTENSIONS/CVF_TRUTH_KERNEL/**"
      - "EXTENSIONS/CVF_TRUTH_FLOW/**"
      - "EXTENSIONS/CVF_REFINERY/**"
      - "EXTENSIONS/CVF_ECO_v2.5_MCP_SERVER/**"
      - ".github/workflows/cvf-web-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EXTENSIONS/CVF_v1.6_AGENT_PLATFORM/cvf-web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EXTENSIONS/CVF_v1.6_AGENT_PLATFORM/cvf-web/package-lock.json
      - name: Compatibility gate (impact report)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python ../../../governance/compat/check_core_compat.py --base "$BASE_SHA" --head "$HEAD_SHA" --json --write-report ../../../governance/compat/last-report.json
          python ../../../governance/compat/check_core_compat.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Install Control Plane Foundation dependencies
        working-directory: EXTENSIONS/CVF_CONTROL_PLANE_FOUNDATION
        run: npm ci
      - name: Install CVF Guard Contract dependencies
        working-directory: EXTENSIONS/CVF_GUARD_CONTRACT
        run: npm ci
      - name: Install Model Gateway dependencies
        working-directory: EXTENSIONS/CVF_MODEL_GATEWAY
        run: npm ci
      - name: Install Learning Plane Foundation dependencies
        working-directory: EXTENSIONS/CVF_LEARNING_PLANE_FOUNDATION
        run: npm ci
      - name: Install Execution Plane Foundation dependencies
        working-directory: EXTENSIONS/CVF_EXECUTION_PLANE_FOUNDATION
        run: npm ci
      - name: Install Truth Kernel dependencies
        working-directory: EXTENSIONS/CVF_TRUTH_KERNEL
        run: npm ci
      - name: Install Truth Flow dependencies
        working-directory: EXTENSIONS/CVF_TRUTH_FLOW
        run: npm ci
      - name: Install Refinery dependencies
        working-directory: EXTENSIONS/CVF_REFINERY
        run: npm ci
      - name: Install MCP Server dependencies
        working-directory: EXTENSIONS/CVF_ECO_v2.5_MCP_SERVER
        run: npm ci
      - name: Install Web UI dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: 'release-gate-structural-build-secret'
          NEXTAUTH_URL: 'http://localhost:3000'
          GITHUB_ID: 'release-gate-structural-build-placeholder'
          GITHUB_SECRET: 'release-gate-structural-build-placeholder'
          GOOGLE_ID: 'release-gate-structural-build-placeholder'
          GOOGLE_SECRET: 'release-gate-structural-build-placeholder'
          CVF_OAUTH_PROVIDER: 'github'
          CVF_OAUTH_IDENTITY_BINDINGS_JSON: '[{"provider":"github","providerAccountId":"structural-build-subject","userId":"structural-build-user","role":"viewer","orgId":"structural-build-org","teamId":"structural-build-team"}]'
      - name: Setup Python for cross-process receipt tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Governance Engine test dependencies
        run: python -m pip install -r ../../CVF_v1.6.1_GOVERNANCE_ENGINE/ai_governance_core/requirements.txt

      - name: Prepare owned offline test parents
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cvf-ncr-r1-fixtures" "$RUNNER_TEMP/cvf-ncr-tests"
          echo "CVF_NCR_R1_FIXTURE_ROOT=$RUNNER_TEMP/cvf-ncr-r1-fixtures" >> "$GITHUB_ENV"
          echo "CVF_NCR_TEST_ROOT=$RUNNER_TEMP/cvf-ncr-tests" >> "$GITHUB_ENV"

      - name: Unit tests
        run: npm run test:run
      - name: Coverage (threshold gate)
        run: npm run test:coverage
