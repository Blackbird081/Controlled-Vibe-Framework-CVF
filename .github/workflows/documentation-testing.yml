      PYTHONPATH: ${{ github.workspace }}/EXTENSIONS/CVF_v1.3_IMPLEMENTATION_TOOLKIT
      PYTHONDONTWRITEBYTECODE: '1'
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML

      - name: Run integration tests
        run: |
          pytest EXTENSIONS/CVF_v1.3_IMPLEMENTATION_TOOLKIT/sdk/tests/integration \
            -v \
            --tb=short

  documentation-build:
    name: Documentation Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Validate documentation structure
        run: |
          echo "Checking for required documentation files..."
          test -f README.md || exit 1
          test -f docs/INDEX.md || exit 1
          test -f docs/reference/CVF_MARKDOWN_STRUCTURAL_COMPLETENESS_STANDARD.md || exit 1
          test -f .markdownlintrc || exit 1
          echo "All required documentation files present"

  registry-validate:
    name: Governance Registry Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate governance registry
        run: |
          python governance/skill-library/registry/validate_registry.py

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [active-window-registry, agent-instruction-carrier-compaction, audit-retention-registry, baseline-update-compat, batch-contract-determinism, boardroom-runtime-governance, canon-summary-evidence-separation, conformance-artifact-consistency, corpus-completeness-report-integrity, corpus-to-knowledge-map-reconciliation, cpf-public-surface-maintainability, cpf-shared-batch-helper-adoption, cross-channel-guard-compat, docs-governance-compat, documentation-build, enterprise-evidence-pack, extension-package-check, foundational-guard-surfaces, gc018-stop-boundary-semantics, governed-artifact-authoring, governed-file-size, guard-authoring-standard, guard-registry-compat, incremental-test-log-rotation, integration-test, knowledge-absorption-priority-guard, markdown-lint, markdown-structural-completeness, multi-agent-review-governance, prepublic-p3-readiness, product-value-validation-guard, progress-tracker-sync, python-automation-size, registry-validate, release-manifest-consistency, repository-exposure-classification, repository-lifecycle-classification, review-retention-registry, session-governance-bootstrap, surface-scan-continuity, system-chain-map-freshness, template-skill-standard-guard, test, test-partition-ownership, work-order-dispatch-quality]
    if: always()
    steps:
      - name: Enforce all applicable results
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["JOB_RESULTS"])
          rejected = {job: value.get("result") for job, value in results.items() if value.get("result") != "success"}
          print(json.dumps({"checked": len(results), "rejected": rejected}, sort_keys=True))
          sys.exit(1 if rejected or not results else 0)
          PY
