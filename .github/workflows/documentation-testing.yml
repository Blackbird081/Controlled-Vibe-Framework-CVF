        run: |
          python governance/compat/check_foundational_guard_surfaces.py --base "$BASE_SHA" --head "$HEAD_SHA" --enforce

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml

      - name: Run unit tests
        run: |
          pytest EXTENSIONS/CVF_v1.3_IMPLEMENTATION_TOOLKIT/sdk/tests/unit \
            -v \
            --cov=EXTENSIONS/CVF_v1.3_IMPLEMENTATION_TOOLKIT/sdk \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  registry-validate:
    name: Governance Registry Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate governance registry
        run: |
          python governance/skill-library/registry/validate_registry.py

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [docs-governance-compat, governed-artifact-authoring, markdown-structural-completeness, work-order-dispatch-quality, cpf-public-surface-maintainability, cpf-shared-batch-helper-adoption, batch-contract-determinism, depth-audit-continuation-compat, gc018-stop-boundary-semantics, session-governance-bootstrap, progress-tracker-sync, multi-agent-review-governance, boardroom-runtime-governance, extension-package-check, incremental-test-log-rotation, test-partition-ownership, cross-channel-guard-compat, guard-authoring-standard, repository-exposure-classification, foundational-guard-surfaces, test, registry-validate]
    if: always()

    steps:
      - name: Check status
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Docs governance compat: ${{ needs.docs-governance-compat.result }}"
          echo "Governed artifact authoring: ${{ needs.governed-artifact-authoring.result }}"
          echo "Markdown structural completeness: ${{ needs.markdown-structural-completeness.result }}"
          echo "Work order dispatch quality: ${{ needs.work-order-dispatch-quality.result }}"
          echo "CPF public surface maintainability: ${{ needs.cpf-public-surface-maintainability.result }}"
          echo "CPF shared batch helper adoption: ${{ needs.cpf-shared-batch-helper-adoption.result }}"
          echo "Batch contract determinism: ${{ needs.batch-contract-determinism.result }}"
          echo "Depth-audit continuation compat: ${{ needs.depth-audit-continuation-compat.result }}"
          echo "GC-018 stop-boundary semantics: ${{ needs.gc018-stop-boundary-semantics.result }}"
          echo "Session governance bootstrap: ${{ needs.session-governance-bootstrap.result }}"
          echo "Progress tracker sync: ${{ needs.progress-tracker-sync.result }}"
          echo "Multi-agent review governance: ${{ needs.multi-agent-review-governance.result }}"
          echo "Boardroom runtime governance: ${{ needs.boardroom-runtime-governance.result }}"
          echo "Extension package check: ${{ needs.extension-package-check.result }}"
          echo "Incremental test log rotation: ${{ needs.incremental-test-log-rotation.result }}"
          echo "Test partition ownership: ${{ needs.test-partition-ownership.result }}"
          echo "Cross-channel guard compat: ${{ needs.cross-channel-guard-compat.result }}"
          echo "Guard authoring standard: ${{ needs.guard-authoring-standard.result }}"
          echo "Repository exposure classification: ${{ needs.repository-exposure-classification.result }}"
          echo "Foundational guard surfaces: ${{ needs.foundational-guard-surfaces.result }}"
          echo "Unit tests: ${{ needs.test.result }}"
          echo "Registry validation: ${{ needs.registry-validate.result }}"
          NON_SUCCESS=$(printf '%s' "$RESULTS" | tr ',' '\n' | grep -vc '^success$' || true)
          if [ "$NON_SUCCESS" -ne 0 ]; then
            echo "One or more required checks were not successful."
            exit 1
          fi
          echo "All required checks passed."
