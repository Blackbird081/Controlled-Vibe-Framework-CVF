[build]
  command = "npm --prefix EXTENSIONS/CVF_CONTROL_PLANE_FOUNDATION ci && npm --prefix EXTENSIONS/CVF_MODEL_GATEWAY install --no-audit --no-fund && npm --prefix EXTENSIONS/CVF_LEARNING_PLANE_FOUNDATION ci && npm --prefix EXTENSIONS/CVF_GUARD_CONTRACT ci && npm --prefix EXTENSIONS/CVF_EXECUTION_PLANE_FOUNDATION ci && npm --prefix EXTENSIONS/CVF_v1.6_AGENT_PLATFORM/cvf-web ci && npm --prefix EXTENSIONS/CVF_v1.6_AGENT_PLATFORM/cvf-web run build"
  publish = "EXTENSIONS/CVF_v1.6_AGENT_PLATFORM/cvf-web/.next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/"
  to = "/home?template=:template"
  status = 302
  force = true
  query = {template = ":template"}

[[redirects]]
  from = "/"
  to = "/home?category=:category"
  status = 302
  force = true
  query = {category = ":category"}

[[redirects]]
  from = "/"
  to = "/landing"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
